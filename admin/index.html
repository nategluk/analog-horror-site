<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Детский ЖИР // Copy Desk</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">LOCAL ONLY · COPY DESK</p>
        <h1>Стол реплик</h1>
      </div>
      <nav class="game-tabs" id="game-tabs" aria-label="Игры"></nav>
      <div class="top-actions">
        <button type="button" id="btn-characters">Герои</button>
        <a class="button-link" href="/admin/nodes.html">Узлы Ирины</a>
        <a class="button-link" href="/hiring.html" target="_blank" rel="noreferrer">Сайт</a>
      </div>
    </header>

    <section class="status" id="status" role="status" aria-live="polite">
      Загрузка…
    </section>

    <main class="desk">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2>Ветки <span id="node-count"></span></h2>
          <input
            id="search"
            type="search"
            placeholder="Найти фразу, героя, узел"
            autocomplete="off"
          />
        </div>
        <ul id="node-list" class="node-list"></ul>
      </aside>

      <section class="script" id="script">
        <p class="empty">Выберите ветку слева.</p>
      </section>
    </main>

    <dialog id="characters" class="sheet">
      <form method="dialog" class="sheet-head">
        <h2>Герои</h2>
        <button type="submit" value="close">Закрыть</button>
      </form>
      <p class="hint">
        Смена имени переписывает подпись говорящего и отправителя писем кабинета
        во всём сценарии этой игры. Роли панели (мысль, система) заблокированы —
        они держат вёрстку, а не персонажа.
      </p>
      <div id="character-list"></div>
    </dialog>

    <script src="/admin/admin.js"></script>
  </body>
</html>
