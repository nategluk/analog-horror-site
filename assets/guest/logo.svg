    <linearGradient id="pink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f58aa7" />
      <stop offset="1" stop-color="#dc607f" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8c5260" flood-opacity="0.18" />
    </filter>
  </defs>

