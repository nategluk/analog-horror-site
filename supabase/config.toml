project_id = "analog-horror-site"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://detskiyzhir.org/"
additional_redirect_urls = [
  "https://detskiyzhir.org/auth/confirm.html",
  "http://127.0.0.1:4173/auth/confirm.html",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "TYNDEX // ССЫЛКА ДОСТУПА К ЛИЧНОМУ ДЕЛУ"
content_path = "./supabase/templates/magic-link.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.begin-dossier-claim]
enabled = true
verify_jwt = false
entrypoint = "./functions/begin-dossier-claim/index.ts"

[functions.consume-dossier-claim]
enabled = true
verify_jwt = false
entrypoint = "./functions/consume-dossier-claim/index.ts"
